[package]
name = "Meter-rs"
version = "1.0.6"
edition = "2024"
build = "build.rs"
repository = "https://github.com/Jaydar/meter-rs"





[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process","macros"] }
rayon = "1"
anyhow = "1"
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
i-slint-backend-winit = { version = "1", default-features = false, features = ["renderer-software"] }
i-slint-backend-selector = { version = "1", default-features = false, features = ["unstable-winit-030", "renderer-software"] }
tray-icon = { version = "0", default-features = false }
muda = { version = "0", default-features = false }
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "time"] }
tracing-appender = "0"
time = { version = "0", features = ["formatting", "macros"] }
config = { version = "0", default-features = false, features = ["yaml"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0"
resvg = "0"

raw-window-handle = "0"
winit = "0"
sysinfo = "0"
windows = { version = "0", features = [
    # "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi"
] }

[build-dependencies]
slint-build = "1"
winresource = "0"


[package.metadata.winresource]
ProductName = "Meter RS"
OriginalFilename = "meter-rs.exe"
LegalCopyright = "Copyright © 2025 Jaydar"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
