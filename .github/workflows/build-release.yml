name: Build And Publish Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,x86_64-pc-windows-gnu

      - name: Add MinGW to PATH
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\mingw64\bin'

      - name: Read package info from Cargo.toml
        id: package
        shell: powershell
        run: |
          $name = (Select-String -Path Cargo.toml -Pattern '^name\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=$name v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build both Windows targets
        shell: powershell
        run: cargo build-win

      - name: Prepare release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\meter-rs.exe dist\meter-rs-msvs.exe
          Copy-Item target\x86_64-pc-windows-gnu\release\meter-rs.exe dist\meter-rs-gnu.exe

      - name: Publish rolling release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.package.outputs.version }}
          name: ${{ steps.package.outputs.release_name }}
          body: Automated build from the latest commit on master.
          prerelease: false
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: dist/meter-rs-msvs.exe,dist/meter-rs-gnu.exe
